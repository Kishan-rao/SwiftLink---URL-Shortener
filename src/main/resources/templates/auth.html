<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - SwiftLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .auth-tab.active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
        <div class="flex border-b border-gray-700 mb-8">
            <button id="loginTab" onclick="switchTab('login')" class="auth-tab active flex-1 py-4 text-center font-bold transition">Sign In</button>
            <button id="registerTab" onclick="switchTab('register')" class="auth-tab flex-1 py-4 text-center font-bold text-gray-500 transition">Register</button>
        </div>

        <div id="loginSection">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold">Welcome Back</h1>
                <p class="text-gray-400 mt-1">Sign in to manage your links.</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Email Address</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-white">
                </div>
                <button type="submit" id="loginBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition shadow-lg">Sign In</button>
            </form>
        </div>

        <div id="registerSection" class="hidden">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold">Create Account</h1>
                <p class="text-gray-400 mt-1">Join SwiftLink today.</p>
            </div>
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Full Name</label>
                    <input type="text" id="regName" required class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Email Address</label>
                    <input type="email" id="regEmail" required class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                    <input type="password" id="regPassword" required class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-white">
                </div>
                <button type="submit" id="regBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition shadow-lg">Register</button>
            </form>
        </div>

        <div id="errorContainer" class="hidden mt-6 p-3 bg-red-900/30 border border-red-800 rounded-lg">
            <p id="errorMsg" class="text-sm text-red-300 text-center"></p>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginSection = document.getElementById('loginSection');
            const registerSection = document.getElementById('registerSection');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const errorContainer = document.getElementById('errorContainer');

            errorContainer.classList.add('hidden');

            if (tab === 'login') {
                loginSection.classList.remove('hidden');
                registerSection.classList.add('hidden');
                loginTab.classList.add('active');
                loginTab.classList.remove('text-gray-500');
                registerTab.classList.remove('active');
                registerTab.classList.add('text-gray-500');
            } else {
                loginSection.classList.add('hidden');
                registerSection.classList.remove('hidden');
                loginTab.classList.remove('active');
                loginTab.classList.add('text-gray-500');
                registerTab.classList.add('active');
                registerTab.classList.remove('text-gray-500');
            }
        }

        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const errorContainer = document.getElementById('errorContainer');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errorContainer.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.message || 'Login failed');
                }

                const data = await response.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('userEmail', email);
                window.location.href = '/dashboard';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorContainer.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        const registerForm = document.getElementById('registerForm');
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const btn = document.getElementById('regBtn');
            const errorContainer = document.getElementById('errorContainer');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.textContent = 'Creating account...';
            errorContainer.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.message || 'Registration failed');
                }

                alert('Account created! You can now sign in.');
                switchTab('login');
                document.getElementById('loginEmail').value = email;
            } catch (err) {
                errorMsg.textContent = err.message;
                errorContainer.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Register';
            }
        });
    </script>
</body>
</html>
