<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftLink - Professional URL Shortener</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/custom.css">
</head>

<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <nav class="absolute top-0 left-0 right-0 p-6 flex justify-between items-center max-w-6xl mx-auto w-full">
        <div class="flex items-center space-x-2">
            <div class="h-8 w-8 bg-blue-600 rounded-lg flex items-center justify-center">
                <span class="text-white font-bold">S</span>
            </div>
            <span class="text-xl font-bold tracking-tight">SwiftLink</span>
        </div>
        <div id="navAuth" class="flex items-center space-x-6">
            <a href="/auth" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-bold transition shadow-lg">Sign In</a>
        </div>
        <div id="navUser" class="hidden flex items-center space-x-6">
            <a href="/dashboard" class="text-gray-400 hover:text-white transition text-sm font-medium">Dashboard</a>
            <button onclick="logout()" class="text-gray-400 hover:text-white transition text-sm font-medium">Logout</button>
        </div>
    </nav>

    <div class="w-full max-w-lg bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                SwiftLink
            </h1>
            <p class="text-gray-400 mt-2">Simplify your links, track your reach.</p>
        </div>

        <form id="shortenForm" class="space-y-4">
            <div>
                <label for="urlInput" class="block text-sm font-medium text-gray-400 mb-1">Enter long URL</label>
                <input type="text" id="urlInput" placeholder="e.g. www.google.com" required
                    class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition text-white placeholder-gray-600">

                <div id="errorContainer"
                    class="hidden mt-3 p-3 bg-red-900/30 border border-red-800 rounded-lg flex items-start space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-400 flex-shrink-0 mt-0.5"
                        viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                            clip-rule="evenodd" />
                    </svg>
                    <p id="errorMsg" class="text-sm text-red-300"></p>
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold rounded-lg shadow-lg transform transition hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-50 disabled:cursor-not-allowed">
                Shorten URL
            </button>
        </form>

        <div id="resultCard" class="hidden mt-8 pt-6 border-t border-gray-700 animate-fade-in">
            <div class="flex items-center justify-between bg-gray-900 p-4 rounded-lg border border-gray-700 relative">
                <a id="shortLink" href="#" target="_blank"
                    class="text-emerald-400 hover:underline truncate mr-4 font-mono text-lg"></a>

                <div class="flex items-center">
                    <span id="copyFeedback"
                        class="hidden text-xs text-emerald-400 font-bold mr-2 animate-bounce">Copied!</span>

                    <button onclick="copyToClipboardIndex()"
                        class="text-gray-400 hover:text-white transition p-2 rounded-md hover:bg-gray-800"
                        title="Copy to clipboard">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="mt-4 text-center">
                <a id="statsLink" href="#" class="text-xs hover:text-blue-400 transition">View Stats</a>
            </div>
        </div>
    </div>

    <div class="mt-12 text-gray-500 text-sm">
        <a href="/swagger-ui/index.html" class="hover:text-blue-400 transition underline">Developer API</a>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/index.js"></script>
</body>

</html>
