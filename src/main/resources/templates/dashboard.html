<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SwiftLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 md:p-8">

    <nav class="max-w-6xl mx-auto flex justify-between items-center mb-12">
        <a href="/shorten" class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
            SwiftLink
        </a>
        <div class="flex items-center space-x-6">
            <span id="userEmailDisplay" class="text-gray-400 hidden md:inline"></span>
            <button onclick="logout()" class="text-sm text-gray-400 hover:text-white transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <h2 class="text-3xl font-bold">My Links</h2>
            <a href="/shorten" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium transition shadow-lg text-center">
                + Create New Link
            </a>
        </div>

        <div id="loadingState" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500"></div>
            <p class="mt-4 text-gray-500">Loading your links...</p>
        </div>

        <div id="emptyState" class="hidden text-center py-20 bg-gray-800 rounded-2xl border border-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-600 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
            </svg>
            <h3 class="text-xl font-medium text-gray-300">No links found</h3>
            <p class="text-gray-500 mt-2">Start by creating your first shortened URL.</p>
        </div>

        <div id="linksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Links will be injected here -->
        </div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }

        document.getElementById('userEmailDisplay').textContent = localStorage.getItem('userEmail');

        async function fetchLinks() {
            try {
                const response = await fetch('/api/urls/my', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const links = await response.json();
                displayLinks(links);
            } catch (err) {
                console.error('Error fetching links:', err);
                document.getElementById('loadingState').innerHTML = '<p class="text-red-400">Failed to load links. Please try again.</p>';
            }
        }

        function displayLinks(links) {
            const grid = document.getElementById('linksGrid');
            const loading = document.getElementById('loadingState');
            const empty = document.getElementById('emptyState');

            loading.classList.add('hidden');
            grid.innerHTML = '';

            if (links.length === 0) {
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            links.forEach(link => {
                const card = document.createElement('div');
                card.className = 'bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg hover:border-gray-500 transition flex flex-col justify-between';
                
                const code = link.shortUrl.split('/').pop();
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-xs font-bold px-2 py-1 bg-blue-900/50 text-blue-400 rounded uppercase tracking-wider">
                                ${link.alias ? 'Custom' : 'Standard'}
                            </span>
                            <div class="flex space-x-2">
                                <button onclick="deleteLink('${code}')" class="text-gray-500 hover:text-red-400 transition">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <h3 class="text-emerald-400 font-mono text-lg mb-1 truncate">
                            <a href="${link.shortUrl}" target="_blank" class="hover:underline">${link.shortUrl}</a>
                        </h3>
                        <p class="text-gray-500 text-sm truncate mb-4">${link.originalUrl}</p>
                    </div>
                    <div class="pt-4 border-t border-gray-700 flex justify-between items-center">
                        <div class="flex items-center text-gray-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <span class="font-bold">${link.clicks}</span>
                            <span class="ml-1 text-xs text-gray-500">clicks</span>
                        </div>
                        <a href="/stats/${code}" class="text-xs text-blue-400 hover:underline">View Detailed Stats</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function deleteLink(code) {
            if (!confirm('Are you sure you want to delete this link?')) return;
            
            try {
                const response = await fetch(`/api/urls/${code}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    fetchLinks();
                } else {
                    alert('Failed to delete link');
                }
            } catch (err) {
                console.error('Error deleting link:', err);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userEmail');
            window.location.href = '/login';
        }

        fetchLinks();
    </script>
</body>
</html>
