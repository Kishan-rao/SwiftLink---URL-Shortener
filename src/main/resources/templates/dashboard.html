<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SwiftLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/custom.css">
</head>

<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 md:p-8">

    <nav class="max-w-6xl mx-auto flex justify-between items-center mb-12">
        <a href="/shorten" class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
            SwiftLink
        </a>
        <div class="flex items-center space-x-6">
            <span id="userEmailDisplay" class="text-gray-400 hidden md:inline"></span>
            <button onclick="logout()" class="text-sm text-gray-400 hover:text-white transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <h2 class="text-3xl font-bold">My Links</h2>
            <a href="/shorten" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium transition shadow-lg text-center">
                + Create New Link
            </a>
        </div>

        <div id="loadingState" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500"></div>
            <p class="mt-4 text-gray-500">Loading your links...</p>
        </div>

        <div id="emptyState" class="hidden text-center py-20 bg-gray-800 rounded-2xl border border-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-600 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
            </svg>
            <h3 class="text-xl font-medium text-gray-300">No links found</h3>
            <p class="text-gray-500 mt-2">Start by creating your first shortened URL.</p>
        </div>

        <div id="linksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Links will be injected here -->
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
