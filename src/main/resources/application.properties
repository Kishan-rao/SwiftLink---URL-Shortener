spring.application.name=swiftlink

# Concurrency — Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true

# Redis Config
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}

# AWS DynamoDB Config
aws.region=${AWS_REGION:us-east-1}
aws.dynamodb.endpoint=${DYNAMO_ENDPOINT:http://localhost:8000}
aws.dynamo.access-key=${ACCESS_KEY:key}
aws.dynamo.secret-key=${SECRET_KEY:key}

# Short URL Settings
app.salt=${APP_SALT:SECRET}
app.base-url=${APP_BASE_URL:http://localhost:8080/}

# JWT Auth
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyThatIsAtLeast32CharactersLongForHS256Algorithm}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Rate Limiting (per IP, per window)
app.rate-limit.max-requests=${RATE_LIMIT_MAX:30}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW:60}

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always