# ============================================
# Server Configuration
# ============================================
server.port=8080

# ============================================
# Redis Configuration
# ============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ============================================
# DynamoDB Configuration
# ============================================
aws.region=us-east-1
aws.dynamodb.endpoint=http://localhost:8000
aws.dynamo.access-key=local
aws.dynamo.secret-key=local

# ============================================
# JWT Configuration
# ============================================
app.jwt.secret=ChangeThisToAStrongRandomSecretInProduction_AtLeast32Chars
app.jwt.expiration-ms=86400000

# ============================================
# Application Configuration
# ============================================
app.salt=dev-salt-local
app.base-url=http://192.168.0.186:8080/

# ============================================
# Rate Limiting Configuration
# ============================================
app.rate-limit.max-requests=30
app.rate-limit.window-seconds=60

# ============================================
# Logging Configuration
# ============================================
logging.level.com.kishanrao.shortener=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# ============================================
# Spring Boot Configuration
# ============================================
spring.application.name=swiftlink
spring.threads.virtual.enabled=true

# ============================================
# Actuator Configuration
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=true