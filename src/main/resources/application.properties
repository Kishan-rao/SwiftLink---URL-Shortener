# ============================================
# Server Configuration
# ============================================
server.port=${SERVER_PORT:${PORT:8080}}
server.forward-headers-strategy=framework

# ============================================
# Redis Configuration
# ============================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# ============================================
# DynamoDB Configuration
# ============================================
aws.region=${AWS_REGION:us-east-1}
aws.dynamodb.endpoint=${AWS_DYNAMODB_ENDPOINT:http://localhost:8000}
aws.dynamo.access-key=${AWS_DYNAMO_ACCESS_KEY:local}
aws.dynamo.secret-key=${AWS_DYNAMO_SECRET_KEY:local}

# ============================================
# JWT Configuration
# ============================================
app.jwt.secret=${APP_JWT_SECRET:ChangeThisToAStrongRandomSecretInProduction_AtLeast32Chars}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ============================================
# Application Configuration
# ============================================
app.salt=${APP_SALT:dev-salt-local}
app.base-url=${APP_BASE_URL:http://localhost:${server.port}/}

# ============================================
# Rate Limiting Configuration
# ============================================
app.rate-limit.max-requests=${APP_RATE_LIMIT_MAX_REQUESTS:30}
app.rate-limit.window-seconds=${APP_RATE_LIMIT_WINDOW_SECONDS:60}

# ============================================
# Logging Configuration
# ============================================
logging.level.com.kishanrao.shortener=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# ============================================
# Spring Boot Configuration
# ============================================
spring.application.name=swiftlink
spring.threads.virtual.enabled=true

# ============================================
# Actuator Configuration
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=true
